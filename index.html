<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUN ZONE – Battle Arena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @keyframes slideIn { from { transform:translateX(40px); opacity:0; } to { transform:none; opacity:1; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

    /* ── GAME LOADING OVERLAY ── */
    #game-loading {
      display:none;
      position:fixed; inset:0; z-index:200;
      background:#04081a;
      flex-direction:column;
      align-items:center; justify-content:center;
      font-family:'Rajdhani',sans-serif; color:#fff;
    }
    #game-loading.visible { display:flex; }
    #game-loading .spinner {
      width:64px; height:64px; border-radius:50%;
      border:4px solid rgba(255,100,0,.15);
      border-top-color:#FF6400;
      animation: spin .8s linear infinite;
      margin-bottom:28px;
    }
    #game-loading .load-title {
      font-size:28px; font-weight:700; letter-spacing:4px; color:#FF6400;
      text-shadow:0 0 20px rgba(255,100,0,.5);
      animation: pulse 1.2s ease-in-out infinite;
      margin-bottom:10px;
    }
    #game-loading .load-sub {
      font-size:14px; color:#556; letter-spacing:2px;
    }
    #game-loading .load-bar-wrap {
      margin-top:24px; width:260px; height:6px;
      background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;
    }
    #game-loading .load-bar {
      height:100%; width:0%; border-radius:3px;
      background:linear-gradient(90deg,#FF6400,#FFD700);
      transition:width .25s ease;
    }
    #game-loading .load-error {
      display:none; margin-top:20px; font-size:14px; color:#f44;
      text-align:center; max-width:340px; line-height:1.6;
    }
    #game-loading .load-retry {
      display:none; margin-top:16px;
      padding:10px 28px; border:none; border-radius:6px;
      background:linear-gradient(135deg,#FF7D00,#CC4400);
      color:#fff; font-family:'Rajdhani',sans-serif; font-size:16px;
      font-weight:700; cursor:pointer; letter-spacing:1px;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════ GAME LOADING OVERLAY -->
  <div id="game-loading">
    <div class="spinner"></div>
    <div class="load-title">LADE MATCH</div>
    <div class="load-sub" id="load-sub-text">Verbinde mit Server…</div>
    <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
    <div class="load-error" id="load-error"></div>
    <button class="load-retry" id="load-retry" onclick="location.reload()">↺  NEU LADEN</button>
  </div>

  <!-- ═══════════════════════════════════════════════ MAIN LOBBY -->
  <div id="lobby-screen" class="screen">
    <canvas id="lobbyCanvas"></canvas>
  </div>

  <!-- ═══════════════════════════════════════════════ MATCHMAKING -->
  <div id="matchmaking-screen" class="screen">
    <canvas id="mmCanvas"></canvas>
  </div>

  <!-- ═══════════════════════════════════════════════ PRE-GAME LOBBY -->
  <div id="pregame-screen" class="screen">
    <canvas id="pgCanvas"></canvas>
    <div id="pg-ui">
      <button id="pg-ready-btn" class="btn btn--primary">BEREIT MACHEN</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════ GAME -->
  <div id="game-screen" class="screen">
    <canvas id="gameCanvas"></canvas>
    <div class="controls-hint">
      <span>WASD</span> Bewegen &nbsp;|&nbsp;
      <span>Maus</span> Zielen &nbsp;|&nbsp;
      <span>LMB</span> Schießen &nbsp;|&nbsp;
      <span>R</span> Nachladen &nbsp;|&nbsp;
      <span>Q/E</span> Peeken &nbsp;|&nbsp;
      <span>F</span> Looten / Einsteigen
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════ RESULTS -->
  <div id="results-screen" class="screen">
    <div class="results-card">
      <div id="results-winner">🏆 DU GEWINNST!</div>
      <div class="results-subtitle">MATCH BEENDET • 30 MINUTEN</div>
      <div id="results-body"></div>
      <div class="results-btns">
        <button class="btn btn--primary" id="btn-play-again">▶ NOCHMAL SPIELEN</button>
        <button class="btn btn--secondary" id="btn-lobby">LOBBY</button>
      </div>
    </div>
  </div>

  <!-- Game scripts -->
  <script src="js/weapons.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/game.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/matchmaking.js"></script>
  <script src="js/pregame.js"></script>
  <script src="js/main.js"></script>

  <!-- Three.js loaded last, dynamically with fallback -->
  <script>
    // Load Three.js from CDN with fallback, then load game3d.js
    (function() {
      var CDNS = [
        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js',
        'https://unpkg.com/three@0.158.0/build/three.min.js',
      ];
      var idx = 0;
      function tryLoad() {
        if (idx >= CDNS.length) {
          // All CDNs failed — mark THREE as unavailable
          window._threeLoadFailed = true;
          return;
        }
        var s = document.createElement('script');
        s.src = CDNS[idx++];
        s.onload = function() {
          // Now load game3d.js
          var g = document.createElement('script');
          g.src = 'js/game3d.js';
          document.head.appendChild(g);
        };
        s.onerror = function() { tryLoad(); }; // try next CDN
        document.head.appendChild(s);
      }
      tryLoad();
    })();
  </script>

</body>
</html>
